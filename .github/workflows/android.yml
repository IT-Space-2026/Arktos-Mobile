name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7
    - name: set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build scMain debug APK
      run: ./gradlew assembleScMainDebug
    - name: Unit Test
      run: ./gradlew testScMainDebugUnitTest
    - name: Upload APK
      uses: actions/upload-artifact@v7
      with:
        name: app
        path: app/build/outputs/apk/scMain/debug/*.apk
