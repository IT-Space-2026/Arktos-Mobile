name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7
    - name: set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
    - name: Install cargo-ndk
      run: cargo install cargo-ndk --version 4.1.2 --locked
    - name: Install Android NDK
      run: sdkmanager --install "ndk;28.2.13676358"
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build scMain debug APK
      run: ./gradlew assembleScMainDebug
    - name: Unit Test
      run: ./gradlew testScMainDebugUnitTest
    - name: Upload APK
      uses: actions/upload-artifact@v7
      with:
        name: app
        path: app/build/outputs/apk/scMain/debug/*.apk
