name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7
    - name: set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
    - name: Install cargo-ndk
      run: cargo install cargo-ndk --version 4.1.2 --locked
    - name: Install Android NDK
      run: |
        # The build resolves the newest side-by-side NDK under the SDK —
        # runners ship one already, so only install when none exists.
        # sdkmanager is not on PATH on ubuntu-26.04; it lives under
        # $ANDROID_HOME/cmdline-tools/latest/bin.
        if [ -d "$ANDROID_HOME/ndk" ] && ls "$ANDROID_HOME/ndk" | grep -q .; then
          echo "Using preinstalled NDK: $(ls "$ANDROID_HOME/ndk" | sort | tail -1)"
          exit 0
        fi
        SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        if [ ! -x "$SDKMANAGER" ]; then
          SDKMANAGER="$(command -v sdkmanager || true)"
        fi
        if [ -z "$SDKMANAGER" ]; then
          echo "sdkmanager not found under $ANDROID_HOME or PATH" >&2
          exit 1
        fi
        "$SDKMANAGER" --install "ndk;28.2.13676358"
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build scMain debug APK
      run: ./gradlew assembleScMainDebug
    - name: Unit Test
      run: ./gradlew testScMainDebugUnitTest
    - name: Upload APK
      uses: actions/upload-artifact@v7
      with:
        name: app
        path: app/build/outputs/apk/scMain/debug/*.apk
