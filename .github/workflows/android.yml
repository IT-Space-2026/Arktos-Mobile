name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7
    - name: set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21
    - name: Install Rust toolchain
      # No toolchain input: rust/rust-toolchain.toml pins the channel
      # and the Android targets (SEC16).
      uses: dtolnay/rust-toolchain@master
    - name: Install cargo-ndk
      run: cargo install cargo-ndk --version 4.1.2 --locked
    - name: Install Android NDK
      run: |
        # The build pins android.ndkVersion — this exact side-by-side
        # NDK must exist regardless of what the runner image ships.
        # sdkmanager is not on PATH on ubuntu-26.04; it lives under
        # $ANDROID_HOME/cmdline-tools/latest/bin.
        NDK_VERSION="28.2.13676358"
        if [ -d "$ANDROID_HOME/ndk/$NDK_VERSION" ]; then
          echo "Using preinstalled NDK $NDK_VERSION"
          exit 0
        fi
        SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        if [ ! -x "$SDKMANAGER" ]; then
          SDKMANAGER="$(command -v sdkmanager || true)"
        fi
        if [ -z "$SDKMANAGER" ]; then
          echo "sdkmanager not found under $ANDROID_HOME or PATH" >&2
          exit 1
        fi
        "$SDKMANAGER" --install "ndk;$NDK_VERSION"
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    # ENG03 — the engine dimension splits variants; build both to keep
    # the gecko backend compiling, test the webview (Lite) variant.
    - name: Build scMain WebView (Lite) debug APK
      run: ./gradlew assembleScMainWebviewDebug
    - name: Build scMain Gecko debug APK
      run: ./gradlew assembleScMainGeckoDebug
    - name: Unit Test
      run: ./gradlew testScMainWebviewDebugUnitTest
    - name: Upload APK
      uses: actions/upload-artifact@v7
      with:
        name: app
        path: app/build/outputs/apk/scMainWebview/debug/*.apk

  security:
    name: Security gates
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7
      with:
        # gitleaks scans full history, not just the tip.
        fetch-depth: 0
    - name: Engine coupling audit
      run: ./.devin/check-engine-audit.sh
    - name: Manifest security lint
      run: ./.devin/check-manifest-security.py
    - name: Secret scan (gitleaks)
      # Pinned binary instead of gitleaks-action: the action needs a
      # paid GITLEAKS_LICENSE on org-owned repos; the OSS CLI does not.
      run: |
        GITLEAKS_VERSION=8.30.1
        curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
        tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
        /tmp/gitleaks git --redact --log-level warn .
    - name: Dependency vulnerability scan (OSV)
      # Covers Cargo.lock directly; Gradle deps are covered by
      # .github/dependabot.yml alerts (Groovy build.gradle is not
      # an OSV-parseable manifest).
      uses: google/osv-scanner-action@v2.7.0
      with:
        scan-args: |-
          --recursive
          ./
