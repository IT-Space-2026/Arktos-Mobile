name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7
    - name: set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
    - name: Install cargo-ndk
      run: cargo install cargo-ndk --version 4.1.2 --locked
    - name: Install Android NDK
      run: |
        # The build resolves the newest side-by-side NDK under the SDK —
        # runners ship one already, so only install when none exists.
        # sdkmanager is not on PATH on ubuntu-26.04; it lives under
        # $ANDROID_HOME/cmdline-tools/latest/bin.
        if [ -d "$ANDROID_HOME/ndk" ] && ls "$ANDROID_HOME/ndk" | grep -q .; then
          echo "Using preinstalled NDK: $(ls "$ANDROID_HOME/ndk" | sort | tail -1)"
          exit 0
        fi
        SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        if [ ! -x "$SDKMANAGER" ]; then
          SDKMANAGER="$(command -v sdkmanager || true)"
        fi
        if [ -z "$SDKMANAGER" ]; then
          echo "sdkmanager not found under $ANDROID_HOME or PATH" >&2
          exit 1
        fi
        "$SDKMANAGER" --install "ndk;28.2.13676358"
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build scMain debug APK
      run: ./gradlew assembleScMainDebug
    - name: Unit Test
      run: ./gradlew testScMainDebugUnitTest
    - name: Upload APK
      uses: actions/upload-artifact@v7
      with:
        name: app
        path: app/build/outputs/apk/scMain/debug/*.apk

  security:
    name: Security gates
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7
      with:
        # gitleaks scans full history, not just the tip.
        fetch-depth: 0
    - name: Engine coupling audit
      run: ./.devin/check-engine-audit.sh
    - name: Manifest security lint
      run: ./.devin/check-manifest-security.py
    - name: Secret scan (gitleaks)
      # Pinned binary instead of gitleaks-action: the action needs a
      # paid GITLEAKS_LICENSE on org-owned repos; the OSS CLI does not.
      run: |
        GITLEAKS_VERSION=8.30.1
        curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
        tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
        /tmp/gitleaks git --redact --log-level warn .
    - name: Dependency vulnerability scan (OSV)
      # Covers Cargo.lock directly; Gradle deps are covered by
      # .github/dependabot.yml alerts (Groovy build.gradle is not
      # an OSV-parseable manifest).
      uses: google/osv-scanner-action@v2.7.0
      with:
        scan-args: |-
          --recursive
          ./
