<!DOCTYPE html>
<!-- This Source Code Form is subject to the terms of the Mozilla Public
   - License, v. 2.0. If a copy of the MPL was not distributed with this
   - file, You can obtain one at http://mozilla.org/MPL/2.0/. -->
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta content="en-us" http-equiv="Content-Language" />
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>${TITLE}</title>
    <style>

        * {
            margin: 0;
            padding: 0;
        }

        /* Private-branded variant of the start page: deep
           private-browsing navy instead of the light aurora gradient.
           The gradient lives on a viewport-height <html> so short
           content leaves no banded seam at the bottom. */
        html {
            min-height: 100%;
            background: linear-gradient(to bottom, #2c4d8f 0%, #16294f 55%, #0f1d3d 100%);
        }

        body {
            margin: 0;
            padding-bottom: 32px;
            text-align: center;
            color: #e9effc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
        }

        /* Aurora stage: navy-shifted wave band whose crest passes
           behind the plain logo — same composition as the start page. */
        #aurora {
            position: relative;
            height: 240px;
            margin-top: 20px;
            background: url("file:///android_asset/aurora-wave-private.svg") no-repeat center 0 / 1600px 300px;
        }

        #aurora img {
            position: absolute;
            left: 50%;
            top: 18px;
            width: 170px;
            height: 170px;
            margin-left: -85px;
        }

        #header, .shortcuts {
            width: 88%;
            max-width: 500px;
            margin: 12px auto;
            border-radius: 0.8em;
        }

        #header {
            background:
                radial-gradient(130% 220% at 85% -40%,
                    rgba(46, 200, 245, 0.25) 0%,
                    rgba(74, 143, 232, 0.15) 40%,
                    rgba(74, 143, 232, 0) 70%),
                linear-gradient(to bottom, #3a5da8 0%, #2a447f 90%, #21376b 100%);
            box-shadow: 0 2px 14px rgba(74, 143, 232, 0.35);
            padding: 14px 25px;
            text-align: center;
        }

        #header h1 {
            display: inline;
            font-size: 1.7em;
            color: #fff;
            font-weight: bold;
            text-shadow: 0 1px 6px rgba(46, 200, 245, 0.4);
        }

        #privatedesc {
            width: 88%;
            max-width: 500px;
            margin: 12px auto;
            color: #b9c8ea;
        }

        /* Shortcut tiles card, same rounded-card style as the
           start page and the error/interstitial pages. */
        .shortcuts {
            background: #223055;
            box-shadow: 0 2px 14px rgba(0, 0, 0, 0.35);
            border-top: 2px solid rgba(74, 143, 232, 0.65);
            padding: 18px 12px;
            position: relative;
        }

        .link {
            height: 48px;
            width: 48px;
            background-color: #45578a;
            border-radius: 12px;
            display: inline-block;
            margin: 8px 12px;
            vertical-align: middle;
        }

        .edit {
            position: absolute;
            top: 10px;
            right: 12px;
            cursor: pointer;
            fill: #c8d4f2;
        }

        #privatelogo {
            text-align: center;
            margin-top: 24px;
        }

        #privatelogo img {
            height: 110px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            padding-top: 5vh;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.4);
            text-align: left;
        }

        .modal-content {
            background-color: #223055;
            color: #e9effc;
            margin: auto;
            padding: 20px;
            width: 80%;
            max-width: 480px;
            border-radius: 0.8em;
            border: 1px solid #45578a;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
        }

        .modal-content input[type=url] {
            width: 90%;
            padding: 6px 8px;
            border: 1px solid #45578a;
            border-radius: 6px;
            font-size: 14px;
            background: #16213f;
            color: #e9effc;
        }

        .modal-content input[type=url]:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(46, 200, 245, 0.8),
                        0 0 12px rgba(74, 143, 232, 0.35);
        }

        .modal-actions {
            margin-top: 16px;
            text-align: right;
        }

        .button-material {
            position: relative;
            display: inline-block;
            box-sizing: border-box;
            border: none;
            border-radius: 4px;
            padding: 0 16px;
            min-width: 64px;
            height: 36px;
            vertical-align: middle;
            text-align: center;
            text-transform: uppercase;
            background: linear-gradient(to right, #2ec8f5 0%, #6b5fd4 100%);
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            line-height: 36px;
            overflow: hidden;
            outline: none;
            cursor: pointer;
            margin-left: 8px;
        }

        .button-material.close {
            background: #45578a;
        }

        /* Dark variant: IncognitoPageFactory adds the arktos-dark class
           to <html> when the start page follows a dark app theme — the
           already-dark navy palette deepens further. */
        html.arktos-dark {
            background: linear-gradient(to bottom, #1a2a52 0%, #101a33 60%, #0b1327 100%);
        }

        html.arktos-dark body {
            color: #e5ecfa;
        }

        html.arktos-dark .shortcuts {
            background: #1a2440;
            box-shadow: 0 2px 18px rgba(0, 0, 0, 0.5);
        }

    </style>
</head>

<body>
    <div id="aurora">
        <img id="image_url" src="file:///android_asset/arktos-plain.svg" alt="Arktos"/>
    </div>
    <div id="header">
        <h1 id="title-pm">$title</h1>
    </div>
    <div id="privatedesc">
        <p id="desc-pm">$description</p>
    </div>
    <div class="shortcuts" id="shortcuts">
        <a id="link1click" href="//google.com"><img src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" class="link" id="link1" alt=""/></a>
        <a id="link2click" href="//google.com"><img src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" class="link" id="link2" alt=""/></a>
        <a id="link3click" href="//google.com"><img src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" class="link" id="link3" alt=""/></a>
        <a id="link4click" href="//google.com"><img src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" class="link" id="link4" alt=""/></a>
        <svg class="edit" xmlns="http://www.w3.org/2000/svg" height="16" viewBox="0 0 24 24" width="16"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M3 17.46v3.04c0 .28.22.5.5.5h3.04c.13 0 .26-.05.35-.15L17.81 9.94l-3.75-3.75L3.15 17.1c-.1.1-.15.22-.15.36zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
    </div>
    <div id="privatelogo">
        <img src="file:///android_asset/private-sunglasses.svg" alt="Private"/>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <h1 id="edit_shortcuts">Edit shortcuts</h1>
            <br>
            <label for="link1">Link 1:</label><br>
            <input type="url" id="link1inp" name="link1" value="https://github.com"><br><br>
            <label for="link2">Link 2:</label><br>
            <input type="url" id="link2inp" name="link2" value="https://google.com"><br><br>
            <label for="link3">Link 3:</label><br>
            <input type="url" id="link3inp" name="link3" value="https://youtube.com"><br><br>
            <label for="link4">Link 4:</label><br>
            <input type="url" id="link4inp" name="link4" value="https://fast.com"><br>
            <div class="modal-actions">
                <button class="close button-material" id="close">Close</button>
                <button class="save button-material" id="apply">Apply</button>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        var link1var = "https://github.com";
        var link2var = "https://google.com";
        var link3var = "https://youtube.com";
        var link4var = "https://fast.com";
    </script>
    <script type="text/javascript">
        // MPL 2.0
        var modal = document.getElementById("editModal");
        var editbtn = document.getElementsByClassName("edit")[0];
        var save = document.getElementsByClassName("save")[0];
        var span = document.getElementsByClassName("close")[0];

        editbtn.onclick = function() {
            modal.style.display = "block";
            document.getElementById('link1inp').value = window.link1var;
            document.getElementById('link2inp').value = window.link2var;
            document.getElementById('link3inp').value = window.link3var;
            document.getElementById('link4inp').value = window.link4var;
        }

        save.onclick = function() {
            localStorage.setItem("link1", document.getElementById('link1inp').value);
            localStorage.setItem("link2", document.getElementById('link2inp').value);
            localStorage.setItem("link3", document.getElementById('link3inp').value);
            localStorage.setItem("link4", document.getElementById('link4inp').value);
            localStorage.setItem("shouldUpdate", "yes");
            modal.style.display = "none";
            location.reload();
        }

        span.onclick = function() {
            modal.style.display = "none";
        }

        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>
</body>

</html>
