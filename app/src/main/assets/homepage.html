<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta content="en-us" http-equiv="Content-Language" />
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>${TITLE}</title>
    <style>

        * {
            margin: 0;
            padding: 0;
        }

        /* The gradient lives on a viewport-height <html> so short content
           leaves no banded tile seam at the bottom of the canvas. */
        html {
            min-height: 100%;
            background:
                radial-gradient(120% 55% at 50% -8%,
                    rgba(63, 210, 240, 0.20) 0%,
                    rgba(162, 78, 245, 0.10) 45%,
                    rgba(162, 78, 245, 0) 75%),
                linear-gradient(to bottom, #ccc 0%, #fff 50%, #fff 100%);
        }

        body {
            margin: 0;
            padding-bottom: 32px;
            text-align: center;
            color: #1a1a2e;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
        }

        /* Aurora stage: a full-width wave band whose crest passes behind
           the logo, so the icon's ribbons read as continuing into the
           page background. */
        #aurora {
            position: relative;
            height: 240px;
            margin-top: 20px;
            background: url("file:///android_asset/aurora-wave.svg") no-repeat center 0 / 1600px 300px;
        }

        #aurora img {
            position: absolute;
            left: 50%;
            top: 18px;
            width: 170px;
            height: 170px;
            margin-left: -85px;
        }

        #header, .shortcuts, .column .card {
            width: 88%;
            max-width: 500px;
            margin: 12px auto;
        }

        #header, .shortcuts {
            border-radius: 0.8em;
        }

        #header {
            background:
                radial-gradient(130% 220% at 85% -40%,
                    rgba(34, 245, 154, 0.28) 0%,
                    rgba(63, 210, 240, 0.16) 40%,
                    rgba(63, 210, 240, 0) 70%),
                linear-gradient(to bottom, #228 0%, #66a 90%, #668 100%);
            box-shadow: 0 2px 14px rgba(63, 210, 240, 0.35);
            padding: 14px 25px;
            text-align: center;
        }

        #header h1 {
            display: inline;
            font-size: 1.7em;
            color: #fff;
            font-weight: bold;
            text-shadow: 0 1px 6px rgba(34, 245, 154, 0.45);
        }

        /* Shortcut tiles card, in the same rounded-card style as the
           error/interstitial pages. */
        .shortcuts {
            background: #fff;
            box-shadow: 0 2px 14px rgba(20, 30, 60, 0.12);
            border-top: 2px solid rgba(63, 210, 240, 0.65);
            padding: 18px 12px;
            position: relative;
        }

        .link {
            height: 48px;
            width: 48px;
            background-color: #cfd6e4;
            border-radius: 12px;
            display: inline-block;
            margin: 8px 12px;
            vertical-align: middle;
        }

        .edit {
            position: absolute;
            top: 10px;
            right: 12px;
            cursor: pointer;
            fill: #556;
        }

        .text {
            font-weight: 300;
            margin-top: 0;
        }

        /* News feed cards (INFORMATIVE homepage type). */
        .card {
            box-shadow: 0 2px 14px rgba(20, 30, 60, 0.12);
            transition: 0.3s;
            border-radius: 0.8em;
            padding-top: 4px;
            cursor: pointer;
            background: #fff;
            text-align: left;
            overflow: hidden;
        }

        .card img {
            display: block;
            width: 95%;
            margin: 8px auto 0 auto;
            border-radius: 5px;
        }

        .card-content {
            padding: 8px 16px 14px 16px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            padding-top: 5vh;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.4);
            text-align: left;
        }

        .modal-content {
            background-color: #fff;
            color: #1a1a2e;
            margin: auto;
            padding: 20px;
            width: 80%;
            max-width: 480px;
            border-radius: 0.8em;
            box-shadow: 0 4px 24px rgba(10, 20, 50, 0.35);
        }

        .modal-content input[type=url] {
            width: 90%;
            padding: 6px 8px;
            border: 1px solid #b8c2d8;
            border-radius: 6px;
            font-size: 14px;
        }

        .modal-content input[type=url]:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(63, 210, 240, 0.8),
                        0 0 12px rgba(34, 245, 154, 0.35);
        }

        .modal-actions {
            margin-top: 16px;
            text-align: right;
        }

        .button-material {
            position: relative;
            display: inline-block;
            box-sizing: border-box;
            border: none;
            border-radius: 4px;
            padding: 0 16px;
            min-width: 64px;
            height: 36px;
            vertical-align: middle;
            text-align: center;
            text-transform: uppercase;
            background: linear-gradient(to right, #2ad3ee 0%, #7a5cf0 100%);
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            line-height: 36px;
            overflow: hidden;
            outline: none;
            cursor: pointer;
            margin-left: 8px;
        }

        .button-material.close {
            background: #8892a8;
        }

        .column {
            display: block;
        }

        /* Dark variant: HomePageFactory adds the arktos-dark class to
           <html> when the start page follows a dark app theme. */
        html.arktos-dark {
            background:
                radial-gradient(130% 60% at 50% -10%,
                    rgba(34, 245, 154, 0.14) 0%,
                    rgba(63, 210, 240, 0.12) 35%,
                    rgba(162, 78, 245, 0.16) 60%,
                    rgba(162, 78, 245, 0) 80%),
                linear-gradient(to bottom, #151820 0%, #101218 55%, #0c0e13 100%);
        }

        html.arktos-dark body {
            color: #e4e4e8;
        }

        html.arktos-dark #header {
            background:
                radial-gradient(130% 220% at 85% -40%,
                    rgba(34, 245, 154, 0.30) 0%,
                    rgba(63, 210, 240, 0.18) 40%,
                    rgba(63, 210, 240, 0) 70%),
                linear-gradient(to bottom, #1b2240 0%, #2c2a55 90%, #262441 100%);
            box-shadow: 0 2px 18px rgba(63, 210, 240, 0.30),
                        0 0 34px rgba(162, 78, 245, 0.18);
        }

        html.arktos-dark .shortcuts,
        html.arktos-dark .card,
        html.arktos-dark .modal-content {
            background: #1c2130;
            color: #e4e4e8;
            box-shadow: 0 2px 18px rgba(0, 0, 0, 0.45);
        }

        html.arktos-dark .edit {
            fill: #c8cee0;
        }

        html.arktos-dark .link {
            background-color: #3a4260;
        }

        html.arktos-dark .modal-content input[type=url] {
            background: #181c28;
            color: #e4e4e8;
            border-color: #3a4260;
        }

    </style>
</head>

<body>
    <div id="aurora">
        <img id="image_url" src="file:///android_asset/arktos-plain.svg" alt="Arktos"/>
    </div>
    <div id="header">
        <h1 class="text">Arktos Mobile</h1>
    </div>
    <div class="shortcuts" id="shortcuts">
        <a id="link1click" href="//google.com"><img src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" class="link" id="link1" alt=""/></a>
        <a id="link2click" href="//google.com"><img src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" class="link" id="link2" alt=""/></a>
        <a id="link3click" href="//google.com"><img src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" class="link" id="link3" alt=""/></a>
        <a id="link4click" href="//google.com"><img src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" class="link" id="link4" alt=""/></a>
        <svg class="edit" xmlns="http://www.w3.org/2000/svg" height="16" viewBox="0 0 24 24" width="16"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M3 17.46v3.04c0 .28.22.5.5.5h3.04c.13 0 .26-.05.35-.15L17.81 9.94l-3.75-3.75L3.15 17.1c-.1.1-.15.22-.15.36zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
    </div>
    <div class="columns">
        <div class="column"></div>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <h1 id="edit_shortcuts">Edit shortcuts</h1>
            <br>
            <label for="link1">Link 1:</label><br>
            <input type="url" id="link1inp" name="link1" value="https://github.com"><br><br>
            <label for="link2">Link 2:</label><br>
            <input type="url" id="link2inp" name="link2" value="https://google.com"><br><br>
            <label for="link3">Link 3:</label><br>
            <input type="url" id="link3inp" name="link3" value="https://youtube.com"><br><br>
            <label for="link4">Link 4:</label><br>
            <input type="url" id="link4inp" name="link4" value="https://fast.com"><br>
            <div class="modal-actions">
                <button class="close button-material" id="close">Close</button>
                <button class="save button-material" id="apply">Apply</button>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        var endpoint = "${ENDPOINT}";
        var link1var = "https://github.com";
        var link2var = "https://google.com";
        var link3var = "https://youtube.com";
        var link4var = "https://fast.com";
    </script>
    <script type="text/javascript">
        // MPL 2.0
        var modal = document.getElementById("editModal");
        var editbtn = document.getElementsByClassName("edit")[0];
        var save = document.getElementsByClassName("save")[0];
        var span = document.getElementsByClassName("close")[0];

        editbtn.onclick = function() {
            modal.style.display = "block";
            document.getElementById('link1inp').value = window.link1var;
            document.getElementById('link2inp').value = window.link2var;
            document.getElementById('link3inp').value = window.link3var;
            document.getElementById('link4inp').value = window.link4var;
        }

        save.onclick = function() {
            localStorage.setItem("link1", document.getElementById('link1inp').value);
            localStorage.setItem("link2", document.getElementById('link2inp').value);
            localStorage.setItem("link3", document.getElementById('link3inp').value);
            localStorage.setItem("link4", document.getElementById('link4inp').value);
            localStorage.setItem("shouldUpdate", "yes");
            modal.style.display = "none";
            location.reload();
        }

        span.onclick = function() {
            modal.style.display = "none";
        }

        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }

        if (endpoint !== "" && endpoint.charAt(0) !== "$") {
            var req = new XMLHttpRequest();
            req.overrideMimeType("application/json");
            req.open('GET', endpoint, true);
            req.onload = function() {
                var jsonResponse = JSON.parse(req.responseText);
                for (i in jsonResponse["articles"]) {
                    var div = document.createElement('div');
                    div.className = 'card';
                    div.innerHTML = `<div onclick="window.location.href = '` + jsonResponse["articles"][i]["url"] + `';">
                    <img src='` + jsonResponse["articles"][i]["urlToImage"] + `' onerror='this.style.display = "none"'/> <div class='card-content'>
                    <h2>` + jsonResponse["articles"][i]["title"].replace(" - " + jsonResponse["articles"][i]["source"]["name"], "") + `</h2>
                    <p>` + jsonResponse["articles"][i]["source"]["name"] + ` | by ` + jsonResponse["articles"][i]["author"] + `</p>
                    </div></div>`;
                    document.getElementsByClassName('column')[0].appendChild(div);
                    var br = document.createElement('br');
                    document.getElementsByClassName('column')[0].appendChild(br);
                }
            };
            req.send(null);
        }
    </script>
</body>

</html>
