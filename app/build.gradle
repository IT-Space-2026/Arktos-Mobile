plugins {
    id 'com.google.devtools.ksp'
    id 'com.android.application'
    id 'jacoco'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.arktosbrowser.mobile'
    compileSdk {
        version = release(37) {
            minorApiLevel = 2
        }
    }
    // Pinned so every build host uses identical aapt2/d8/clang binaries
    // (SEC16 — reproducible builds). Bump deliberately.
    buildToolsVersion project.buildToolsVersion
    ndkVersion '28.2.13676358'

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    defaultConfig {
        minSdkVersion project.minSdkVersion
        targetSdkVersion project.targetSdkVersion
        versionName "1.2.4"
        versionCode 165
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        debug {
            multiDexEnabled true
            minifyEnabled false
            shrinkResources false
            proguardFiles 'proguard-project.txt'
            testCoverageEnabled true
        }

        release {
            multiDexEnabled false
            minifyEnabled true
            shrinkResources true
            proguardFiles 'proguard-project.txt'
            testCoverageEnabled false
        }
    }

    testOptions {
        unitTests.all {
            // Let JNA find the host-built libarktos.so so unit tests
            // exercise the real Rust core (PORT01) instead of only
            // asserting linkage failures.
            jvmArgs "-Djna.library.path=${rootDir}/rust/target/debug"
            jacoco {
                // This option needs to be included for robolectric tests
                includeNoLocationClasses = true
                excludes = ['jdk.internal.*']
            }
        }
    }

    flavorDimensions "capabilities", "engine"

    productFlavors {
        // Each dimension owns one manifest placeholder; the label is
        // ${appNameBase}${appNameSuffix}, e.g. "Arktos Light" or
        // "Arktos Mobile beta".
        scMain {
            dimension "capabilities"
            applicationId "com.arktosbrowser.mobile"
            manifestPlaceholders.appNameSuffix = ""
        }
        stable {
            dimension "capabilities"
            applicationId "com.arktosbrowser.mobile"
            manifestPlaceholders.appNameSuffix = ""
        }
        beta {
            dimension 'capabilities'
            applicationId 'com.arktosbrowser.mobile.beta'
            versionCode 16
            versionName "1.0-beta1"
            manifestPlaceholders.appNameSuffix = " beta"
        }

        // ENG03 — the 'engine' dimension picks the rendering backend:
        // `webview` (Android WebView — "Arktos Light") and
        // `gecko` (GeckoView — the full "Arktos"). Variant
        // source sets live in app/src/webview and app/src/gecko.
        webview {
            dimension "engine"
            manifestPlaceholders.appNameBase = "Arktos Light"
            resValue "string", "app_name", "Arktos Light"
            ndk {
                // Rust cannot target armeabi/mips — dead ABIs dropped
                // with the libarktos.so introduction (RCORE01).
                abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
            }
        }
        gecko {
            dimension "engine"
            applicationIdSuffix ".full"
            manifestPlaceholders.appNameBase = "Arktos"
            resValue "string", "app_name", "Arktos"
            ndk {
                // Release scope: the gecko flavor ships arm64-v8a only —
                // GeckoView does not publish armeabi-v7a, and x86 is
                // emulator-only; v7a users take the Lite flavor.
                abiFilters "arm64-v8a"
            }
            // 178MB of stored native libs compress to ~76MB — extract at
            // install instead, halving the direct-download APK size.
            packaging {
                jniLibs {
                    useLegacyPackaging = true
                }
            }
        }
    }

    lintOptions {
        abortOnError true
    }

    packagingOptions {
        exclude '.readme'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding = true
        compose = true
        buildConfig = true
        resValues = true
        aidl = true
    }
    composeOptions {
        // Compiler lives in org.jetbrains.kotlin.plugin.compose since Kotlin 2.0;
        // kotlinCompilerExtensionVersion no longer applies.
    }
}

jacoco {
    toolVersion = "0.8.13"
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.24.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:6.4.0'
    // Real org.json for the unit-test JVM — android.jar ships stubs.
    testImplementation 'org.json:json:20260814'

    // The @aar JNA artifact only ships Android natives; unit tests run
    // on the host JVM and need the desktop jar's libjnidispatch.
    testImplementation 'net.java.dev.jna:jna:5.19.1'

    // support libraries
    implementation "androidx.palette:palette-ktx:1.0.0"
    implementation "androidx.annotation:annotation:1.11.0"
    implementation "androidx.appcompat:appcompat:1.8.0"
    implementation 'com.google.android.material:material:1.14.0'
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    implementation "androidx.core:core-ktx:1.19.1"
    implementation "androidx.constraintlayout:constraintlayout:2.2.2"
    implementation "androidx.drawerlayout:drawerlayout:1.2.0"
    implementation "androidx.preference:preference-ktx:1.2.1"
    // SEC01 — biometric app-lock method (BiometricPrompt compat).
    implementation "androidx.biometric:biometric:1.1.0"

    // html parsing for reading mode
    implementation 'org.jsoup:jsoup:1.23.2'

    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-contrib:3.7.0'

    // downloads
    implementation "org.mozilla.components:concept-fetch:158.0"
    implementation "org.mozilla.components:lib-fetch-httpurlconnection:158.0"

    // dependency injection
    final def daggerVersion = '2.60.1'
    implementation "com.google.dagger:dagger:$daggerVersion"
    ksp "com.google.dagger:dagger-compiler:$daggerVersion"
    compileOnly 'javax.annotation:jsr250-api:1.0'

    // permissions
    implementation 'com.guolindev.permissionx:permissionx:1.8.1'

    // proxy support — I2P Android binding is vendored (i2p/ + aidl/);
    // upstream net.i2p.android:helper stopped releasing in 2017.

    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'com.squareup.okio:okio:3.18.2'

    // rx
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.2'
    implementation 'io.reactivex.rxjava3:rxjava:3.1.12'
    implementation 'io.reactivex.rxjava3:rxkotlin:3.0.1'

    // kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"

    // color picker
    implementation 'com.github.QuadFlask:colorpicker:0.0.15'

    // reading mode — extraction ported to the Rust core (dom_smoothie,
    // PORT01); readability4j is no longer needed.

    // webview tools
    implementation 'androidx.webkit:webkit:1.18.0'

    // ENG03 — GeckoView backend, gecko engine flavor only.
    // The unsuffixed `geckoview` artifact is the STABLE channel
    // (-beta / -nightly are the other two) — keep pinned to the
    // latest KNOWN-GOOD stable from maven.mozilla.org for engine
    // CVE fixes. 158.0.2 (20261021001945) regressed restored
    // background tabs (loads abort without recovery), so the pin
    // stays on 158.0.1 until a newer stable verifies clean.
    geckoImplementation 'org.mozilla.geckoview:geckoview:158.0.20261019185856'

    // lifecycleScope for coroutine-backed background work (MOD02)
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'

    // UniFFI-generated Kotlin bindings for the Rust core call into
    // libarktos.so via JNA.
    implementation 'net.java.dev.jna:jna:5.19.1@aar'

    // onboarding
    implementation 'com.github.AppIntro:AppIntro:6.2.0'

    // memory leak analysis
    final def leakCanaryVersion = '2.14'
    debugImplementation "com.squareup.leakcanary:leakcanary-android:$leakCanaryVersion"

    // code editor — sora-editor is the maintained androidx-native
    // replacement for the abandoned ahmadaghazadeh/CodeEditor (2018).
    implementation 'io.github.Rosemoe.sora-editor:editor:0.23.6'

    // compose
    implementation 'androidx.compose.ui:ui:1.12.1'
    implementation 'androidx.compose.material:material:1.12.1'
    implementation 'androidx.compose.ui:ui-tooling:1.12.1'
    implementation 'androidx.compose.runtime:runtime:1.12.1'
    implementation 'androidx.compose.foundation:foundation:1.12.1'
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11)
    }
}

// ---- Rust core (libarktos.so via UniFFI) ---------------------------------
//
// Two halves, both built from Gradle so `./gradlew assemble...` stays a
// one-command build:
//  * cargo-ndk cross-compiles the cdylib for each supported ABI into
//    build/rustJniLibs/{debug,release} (added as per-build-type jniLibs
//    source dirs).
//  * uniffi-bindgen emits Kotlin bindings into build/generated/source/uniffi
//    (registered on the main `kotlin` source dir set).

def rustDir = "${rootDir}/rust"
def rustHostLib = "${rustDir}/target/debug/libarktos.so"
def uniffiGenDir = "${buildDir}/generated/source/uniffi"
def rustJniLibsDebug = "${buildDir}/rustJniLibs/debug"
def rustJniLibsRelease = "${buildDir}/rustJniLibs/release"

// cargo-ndk needs ANDROID_NDK_HOME (or ANDROID_NDK); resolve the
// side-by-side NDK under the configured SDK matching the pinned
// android.ndkVersion, falling back to newest installed / ndk-bundle.
def rustNdkHome = {
    def sdkDir = androidComponents.sdkComponents.sdkDirectory.get().asFile
    def sideBySide = new File(sdkDir, 'ndk')
    if (sideBySide.directory) {
        // Prefer the pinned ndkVersion so every build host compiles
        // libarktos.so with the same clang (SEC16); fall back to the
        // newest installed for dev machines missing the pin.
        def pinned = new File(sideBySide, android.ndkVersion)
        if (pinned.directory) return pinned.absolutePath
        def newest = sideBySide.listFiles()?.findAll { it.directory }?.sort()?.last()
        if (newest != null) return newest.absolutePath
    }
    def bundle = new File(sdkDir, 'ndk-bundle')
    return bundle.directory ? bundle.absolutePath : null
}

// Deterministic libarktos.so across build hosts (SEC16): rustc embeds
// absolute source paths of registry/git dependencies in panic
// locations and debug info — remap them to fixed prefixes so the
// same source produces identical bytes on any machine. Workspace
// sources already reach rustc as workspace-relative paths.
def cargoRegistryRoot = System.getenv('CARGO_HOME') ?: "${System.getProperty('user.home')}/.cargo"
def rustRustflags = "--remap-path-prefix=${cargoRegistryRoot}/registry=/cargo/registry" +
        " --remap-path-prefix=${cargoRegistryRoot}/git=/cargo/git"

tasks.register('buildRustHostLib', Exec) {
    group = 'build'
    description = 'Builds libarktos for the host — input for uniffi-bindgen metadata.'
    workingDir rustDir
    environment 'RUSTFLAGS', rustRustflags
    // --locked fails the build if Cargo.lock drifts instead of
    // silently resolving new versions (SEC16).
    commandLine 'cargo', 'build', '--locked', '-p', 'arktos-core'
    inputs.files "${rustDir}/Cargo.toml", "${rustDir}/Cargo.lock"
    inputs.dir "${rustDir}/arktos-core"
    outputs.file rustHostLib
}

tasks.register('generateUniffiBindings', Exec) {
    group = 'build'
    description = 'Generates Kotlin bindings for libarktos.so via uniffi-bindgen.'
    dependsOn 'buildRustHostLib'
    workingDir rustDir
    environment 'RUSTFLAGS', rustRustflags
    // --no-format: ktlint is not a build prerequisite.
    commandLine 'cargo', 'run', '--quiet', '--locked', '-p', 'arktos-core',
            '--features', 'cli', '--bin', 'uniffi-bindgen', '--',
            'generate', '--library', rustHostLib,
            '--language', 'kotlin', '--no-format',
            '--out-dir', uniffiGenDir
    inputs.file "${rustDir}/arktos-core/uniffi.toml"
    // Track the built library too — bindings must regenerate when the
    // exported UniFFI surface changes, not just when uniffi.toml does.
    inputs.file rustHostLib
    outputs.dir uniffiGenDir
}

['Debug': rustJniLibsDebug, 'Release': rustJniLibsRelease].each { type, outDir ->
    tasks.register("cargoNdkBuild${type}", Exec) {
        group = 'build'
        description = "Cross-compiles libarktos.so for Android ABIs (${type.toLowerCase()})."

        def ndk = rustNdkHome()
        if (ndk != null) {
            environment 'ANDROID_NDK_HOME', ndk
        }
        environment 'RUSTFLAGS', rustRustflags
        workingDir rustDir

        // Trailing args pass through to `cargo build` — --locked pins
        // dependency resolution to the committed Cargo.lock (SEC16).
        def args = ['cargo', 'ndk',
                    '-t', 'arm64-v8a', '-t', 'armeabi-v7a', '-t', 'x86_64',
                    '--platform', project.minSdkVersion.toString(),
                    '-o', outDir, 'build', '--locked']
        if (type == 'Release') {
            args += '--release'
        }
        commandLine args

        inputs.files "${rustDir}/Cargo.toml", "${rustDir}/Cargo.lock"
        inputs.dir "${rustDir}/arktos-core"
        outputs.dir outDir
    }
}

android {
    sourceSets {
        debug.jniLibs.srcDir rustJniLibsDebug
        release.jniLibs.srcDir rustJniLibsRelease
        // Kotlin sources only — the `java` source dir set carries a
        // `*.java` filter, so the generated .kt must go on `kotlin`.
        main.kotlin.srcDir uniffiGenDir
    }
}

// File-based srcDirs carry no task dependency, so wire the generator and
// the cargo-ndk build into the variant compile/preBuild graph by name.
// KSP also reads the generated bindings off the main source set, so the
// ksp* tasks must depend on the generator too (Gradle fails the build on
// implicit dependencies otherwise).
afterEvaluate {
    tasks.matching {
        it.name ==~ /compile\w*(Kotlin|JavaWithJavac)/ || it.name.startsWith('ksp')
    }.configureEach {
        it.dependsOn 'generateUniffiBindings'
    }
    tasks.matching { it.name.startsWith('pre') && it.name.endsWith('Build') }.configureEach {
        if (it.name.contains('Debug')) {
            it.dependsOn 'cargoNdkBuildDebug'
        } else if (it.name.contains('Release')) {
            it.dependsOn 'cargoNdkBuildRelease'
        }
    }
}