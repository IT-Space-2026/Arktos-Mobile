# osv-scanner config — SEC14 dependency vulnerability gate.
# Accepted advisories live here so the CI gate fails on NEW findings
# only. Each entry needs a reason; ignoreUntil forces re-review.

[[IgnoredVulns]]
id = "RUSTSEC-2026-0374"
reason = "basic-toml is flagged unmaintained (no fix exists). It is a build-time-only transitive dep of askama_derive used for template codegen — never linked into libarktos.so. Revisit on the next askama upgrade."
ignoreUntil = 2027-10-20

[[IgnoredVulns]]
id = "RUSTSEC-2025-0009"
reason = "ring 0.17.8 -> 0.17.12 fixes it; bumped in Cargo.lock. Keeping the ignore for one release so the gate does not flap if the bump is reverted."
ignoreUntil = 2027-01-01

[[IgnoredVulns]]
id = "RUSTSEC-2026-0387"
reason = "crypto-bigint 0.5.5 is pinned transitively by the Arti dep tree (synctor) — its own crates require the 0.5 line; 0.7.x is not semver-compatible. Timing-adjacent bigint issue, not reachable over the sync protocol's threat surface. Revisit on the next Arti upgrade."
ignoreUntil = 2027-01-01

[[IgnoredVulns]]
id = "RUSTSEC-2023-0071"
reason = "rsa 0.9.x Marvin attack — timing side-channel on RSA decryption. Only in the tree as an Arti transitive dep; Arktos never does RSA decryption (sync crypto is Ed25519/x25519/XChaCha20). Upstream has no fix."
ignoreUntil = 2027-01-01

[[IgnoredVulns]]
id = "RUSTSEC-2025-0141"
reason = "bincode 2.0.1 unmaintained advisory — no fix exists. Transitive dep of the Arti tree; the serde wire format is only exercised between paired devices over authenticated links."
ignoreUntil = 2027-01-01

[[IgnoredVulns]]
id = "GHSA-qwgh-2vcv-g2f7"
reason = "block-buffer 0.10.4 CVE — medium-severity issue in the buffer crate, transitive via sha2/ed25519 stack. No compatible fix release on the 0.10 line; risk bounded by in-process usage, not attacker-controlled allocation patterns."
ignoreUntil = 2027-01-01

[[IgnoredVulns]]
id = "RUSTSEC-2024-0436"
reason = "paste 1.0.15 unmaintained — no fix exists, no known exploit. Pure proc-macro crate, compile-time only — never in the runtime attack surface."
ignoreUntil = 2027-01-01
