[package]
name = "arktos-core"
version = "0.1.0"
edition = "2021"
publish = false

# cdylib name must match what the generated Kotlin bindings pass to
# System.loadLibrary — see uniffi.toml (`cdylib_name`) and
# ArktosCore.ensureLoaded() on the Kotlin side.
[lib]
name = "arktos"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
default = []
# Off by default so Android builds don't pull clap/camino into the
# dependency graph; enabled only when running the bindgen binary.
cli = ["uniffi/cli"]
# synctor pulls the embedded Arti tree (MSYNC03) — the tor transport
# backend answers typed-unavailable without it; "mem" stays for tests.
synclan = ["dep:quinn", "dep:socket2", "dep:tokio", "dep:futures", "dep:x509-parser", "dep:rustls"]
synctor = ["dep:arti-client", "dep:tor-hsservice",
           "dep:tor-hscrypto", "dep:tor-llcrypto", "dep:tor-keymgr", "dep:tor-cell",
           "dep:tor-proto", "dep:tor-config", "dep:tor-config-path",
           "dep:tor-rtcompat",
           "dep:tokio", "dep:futures", "dep:safelog", "dep:rustls"]

[dependencies]
uniffi = "=0.32.2"
aho-corasick = "=1.1.5"
# STORE01 — storage core. `bundled` compiles SQLite into libarktos.so;
# Android's libsqlite is not part of the NDK stable ABI.
# SEC15 — `bundled-sqlcipher-vendored-openssl` swaps plain SQLite for
# SQLCipher (full-database AES-256 page encryption) and vendors OpenSSL
# as its crypto provider so host and NDK builds carry no system
# libcrypto dependency.
ring = "=0.17.12"
base64 = "=0.22.1"
sha2 = "=0.10.8"
hmac = "=0.12.1"
curve25519-dalek = "=4.1.3"
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }
rusqlite = { version = "=0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
# STORE01 — Netscape bookmark importer. Tokenizer-only crate; the
# importer builds its own tiny DT/DL state machine on top.
html5gum = "=0.8.4"
# PORT01 — legacy bookmark importer (JSON-lines) + DDG/Baidu/Naver
# suggestion responses.
serde_json = "=1.0.154"
quick-xml = { version = "=0.42.0", features = ["encoding"] }
aes-gcm = "=0.10.3"
zeroize = "=1.8.1"
getrandom = "=0.2.15"
# PORT01 — download filename/MIME core: extension↔type mapping for
mime_guess = "=2.0.5"
# PORT01 — readability port replacing readability4j (same crate the
# desktop core uses).
dom_smoothie = "=0.18.2"
# RANK01 — pure-Rust DEFLATE for extracting the *.csv member out of
# the Tranco top-1m.csv.zip download (same pin the desktop rustcore
# uses for its zip member walk).
miniz_oxide = "=0.9.1"
# PORT02 — app-lock / parental-control password hashing (argon2id +
# versioned stored format replacing the plaintext SharedPreferences).
argon2 = "=0.6.0"
# SEC12 — UTS-46 IDNA processing for the URL-bar punycode display
# (idn.rs): `domain_to_ascii` maps a Unicode host to its A-label form.
idna = "=1.1.0"

# MSYNC03 — Arti transport, exact-pinned like the desktop (SEC21):
# arti-client + the tor-* crates behind the synctor feature so the
# lean build skips the Tor tree; tokio drives the runtime.
arti-client = { version = "=0.47.0", default-features = false,
    optional = true,
    features = ["tokio", "rustls", "keymgr",
                "onion-service-client", "onion-service-service",
                "restricted-discovery", "experimental-api"] }
tor-hsservice = { version = "=0.47.0", optional = true,
    features = ["restricted-discovery", "experimental-api"] }
tor-hscrypto = { version = "=0.47.0", optional = true }
tor-llcrypto = { version = "=0.47.0", optional = true }
tor-keymgr = { version = "=0.47.0", optional = true, features = ["keymgr"] }
tor-cell = { version = "=0.47.0", optional = true }
tor-config = { version = "=0.47.0", optional = true }
tor-config-path = { version = "=0.47.0", optional = true }
tor-proto = { version = "=0.47.0", optional = true }
tor-rtcompat = { version = "=0.47.0", optional = true,
    features = ["tokio", "rustls"] }
tokio = { version = "=1.54.1", optional = true,
    features = ["rt-multi-thread", "sync", "time", "macros", "io-util", "net"] }
futures = { version = "=0.3.34", optional = true }
# SYNC10 LAN fast path — quinn (QUIC) + socket2 (mDNS multicast
# options) + x509-parser (peer cert fingerprints). Same feature
# gate shape as synctor: the lean build skips it entirely.
quinn = { version = "=0.11.12", optional = true,
    features = ["rustls-ring", "runtime-tokio", "log"] }
socket2 = { version = "=0.6.5", optional = true,
    features = ["all"] }
x509-parser = { version = "=0.18.1", optional = true }
safelog = { version = "=0.10.0", optional = true }
rustls = { version = "=0.23.46", default-features = false, optional = true,
           features = ["ring", "logging", "std", "tls12"] }
